name: karvocab

services:
  postgres:
    image: postgres:15-alpine
    container_name: karvocab-postgres
    environment:
      POSTGRES_USER: karvocab
      POSTGRES_PASSWORD: karvocab
      POSTGRES_DB: karvocab
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U karvocab']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: karvocab-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: karvocab-pgadmin
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@karvocab.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pgdata:
