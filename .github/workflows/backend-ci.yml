name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Cổng giống docker-compose local để dùng nguyên .env.test
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: karvocab
          POSTGRES_PASSWORD: karvocab
          POSTGRES_DB: karvocab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U karvocab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      # schema.prisma phải khớp DB sau khi áp migration (không lệch index, bảng...)
      - run: npx dotenv -e .env.test -- npm run db:drift

  docker:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: karvocab
          POSTGRES_PASSWORD: karvocab
          POSTGRES_DB: karvocab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karvocab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t karvocab-backend:${{ github.sha }} backend
      # Chạy thử image thật trên DB trống: migrate, tự seed huy hiệu, /health phải "up"
      - name: Smoke test container
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://karvocab:karvocab@localhost:5432/karvocab \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e JWT_ACCESS_SECRET=ci-smoke-secret-0123456789 \
            -e SOCIAL_AUTH_MODE=real -e GOOGLE_CLIENT_ID=ci \
            karvocab-backend:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3100/api/v1/health | grep -q '"db":"up"'; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs api
          test "$ok" = 1
          PGPASSWORD=karvocab psql -h localhost -U karvocab -d karvocab -tAc \
            "SELECT count(*) FROM badges" | grep -qx 3
